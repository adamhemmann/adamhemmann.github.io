            <!-- Main page content will go here -->
            <main class="main-content">
            <div class="contact-page-content">
                <div class="quick-contact-info-container">
                    <p>Email</p>
                    <p>adam.hemmann@gmail.com</p>
                    <p>Phone</p>
                    <p>573-123-4567</p>
                    <p>Location</p>
                    <p>Columbia, MO</p>
                </div>
                <div class="contact-form-container">
                    <form action="mailto:adam.hemmann@gmail.com?Subject=Contact%20Form" method="post" enctype="text/plain" class="contact-form">
                        <h1 class="contact-form-title">Send me a message!</h1>
                        <p class="form-required-label">*All fields are required</p>
                        <div class="form-row-names">
                        <label for="form-name-prefix">Prefix: </label>
                        <select name="form-name-prefix" id="form-name-prefix" required>
                            <option value="" disabled selected>Select a prefix</option>
                            <option value="Mr">Mr.</option>
                            <option value="Ms">Ms.</option>
                            <option value="Mrs">Mrs.</option>
                            <option value="Dr">Dr.</option>
                            <option value="Prof">Prof.</option>
                            <option value="Rev">Rev.</option>
                            <option value="Fr">Fr.</option>
                            <option value="Hon">Hon.</option>
                            <option value="Atty">Atty.</option>
                        </select>
                        
                        <label for="form-firstname">First name: </label>
                        <input type="text" id="form-firstname" name="form-firstname" placeholder="First name" required>

                        <label for="form-lastname">Last name: </label>
                        <input type="text" id="form-lastname" name="form-lastname" placeholder="Last name" required>
                        </div>

                        <div class="form-row-email">
                        <label for="form-email">Email address: </label>
                        <input type="email" id="form-email" name="form-email" 
                        placeholder="Email address" required>
                        </div>

                        <div class="form-row-message">
                        <label for="form-message">Message: </label>
                        <textarea id="form-message" name="form-message" placeholder="Placeholder" rows="15" cols="50" required></textarea>
                        </div>

                        <div class="form-row-howfind">
                        <p class="form-radio-label">How did you find me?</p>
                            <input type="radio" id="facebook" name="how-find-question" value="Facebook" required>
                            <label for="facebook">Facebook</label>
                            <input type="radio" id="linkedin" name="how-find-question" value="LinkedIn" required>
                            <label for="linkedin">LinkedIn</label>
                            <input type="radio" id="other" name="how-find-question" value="Other" required>
                            <label for="other">Other</label>
                        </div>

                        <div class="form-row-submit">
                            <input type="submit" value="Submit">
                        </div>

                    </form>
                </div>
            </div>
            </main>
